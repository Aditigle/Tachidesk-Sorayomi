name: Build Android arm64-v8a APK (Release)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Show Gradle version
        run: cd android && ./gradlew -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build arm64-v8a release apk
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Rename artifact
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android-arm64-v8a.apk

      - name: Upload artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: android-arm64-v8a.apk

      - name: Publish to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-arm64-v8a.apk
